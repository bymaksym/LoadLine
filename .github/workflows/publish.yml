name: Publish

on:
    push:
        tags: ['v*']

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - run: pnpm install --frozen-lockfile

            - name: The tag is the version
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  version="$(node -p "require('./package.json').version")"
                  test "$tag" = "$version" || {
                      echo "tag $tag does not match package.json $version"
                      exit 1
                  }

            - name: The executable is still LF
              run: |
                  if grep -qU $'\r' bin/loadline.js; then
                      echo 'bin/loadline.js carries CRLF: the shebang would not survive Linux'
                      exit 1
                  fi

            - name: Tests
              run: pnpm test

            - name: Build the command
              run: pnpm run build:cli

            - name: Publish
              run: pnpm publish --access public --no-git-checks --provenance

            - name: GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                      echo "release $GITHUB_REF_NAME already exists — release-please wrote it"
                      exit 0
                  fi
                  gh release create "$GITHUB_REF_NAME" \
                      --verify-tag \
                      --title "$GITHUB_REF_NAME" \
                      --notes "Published to npm as \`@bymaksym/loadline@${GITHUB_REF_NAME#v}\`.

                  See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed."
