# A form rather than a blank box, for one reason: almost every bug in this tool is "the figure
# is wrong", and a figure is impossible to argue about without knowing which build produced it.
# The Copy diagnostics field is the one that matters — it carries the shape of the build with
# every path of the reporter's own code already hashed, so it can be pasted in public.

name: Bug report
description: A wrong figure, a crash, or something the tool refused to read
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              Please do not report security vulnerabilities here — see
              [SECURITY.md](https://github.com/bymaksym/LoadLine/blob/main/SECURITY.md).

    - type: textarea
      id: what
      attributes:
          label: What happened
          description: What you expected, and what you got instead.
      validations:
          required: true

    - type: dropdown
      id: surface
      attributes:
          label: Where
          options:
              - The page (loadline.html)
              - The command (loadline / npx @bymaksym/loadline)
              - Both
      validations:
          required: true

    - type: textarea
      id: diagnostics
      attributes:
          label: Diagnostics
          description: |
              The **Copy diagnostics** button at the end of the report writes about thirty lines
              describing the shape of the build and what Loadline decided about it. Package names
              are real; every path of your own code is replaced by a stable hash, so this is safe
              to paste in public.

              From the command, `--format json` on the same build is the next best thing — check
              it before pasting, because it carries your real paths.
          render: text
      validations:
          required: false

    - type: input
      id: version
      attributes:
          label: Version
          description: '`loadline --version`, or the version written at the foot of the page.'
      validations:
          required: true

    - type: input
      id: environment
      attributes:
          label: Node and bundler
          description: '`node --version`, and which bundler produced the build (Angular, Vite, Rollup, esbuild…) with its version.'
      validations:
          required: true

    - type: textarea
      id: reproduce
      attributes:
          label: How to reproduce
          description: |
              The exact command, or the files you dropped on the page. A public repository that
              reproduces it is worth more than any description — but do not attach a build you
              are not free to share.
      validations:
          required: false
