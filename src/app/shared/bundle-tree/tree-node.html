@let t = i18n.ui();

<div class="row" [class.row--open]="open()">
    <button
        class="twist"
        type="button"
        [attr.aria-expanded]="open()"
        [attr.aria-label]="node().label"
        (click)="open.set(!open())"
    >
        {{ open() ? '−' : '+' }}
    </button>

    <span class="row__label" [title]="node().label">{{ node().label }}</span>

    <!--
    Who pays for the chunk: the zone's square and, in words, when it comes down and for how many
    screens. Under it, only on the rows that hold a lot of their zone, how much of it — the division
    of zone by size that says whether a row is where the weight is or one of forty that are not.
    -->
    <span class="row__zone">
        <span class="row__who">
            <i aria-hidden="true" class="dot" [attr.data-zone]="node().zone"></i>
            {{ whoPays() }}<app-explain [text]="zoneHelp()" />
        </span>
        @if (share(); as share) {
            <span class="row__heavy"
                >{{ t.treeShare(share, node().zone ?? 'own') }}<app-explain [text]="t.treeShareHelp"
            /></span>
        }
    </span>

    <span class="row__share" [title]="barHelp()">
        <i [attr.data-zone]="node().zone" [style.width.%]="sharePercent()"></i>
    </span>

    <span class="row__size">
        {{ node().bytes | bytes }}
        @if (rawSize(); as raw) {
            <small class="row__size-raw">{{ raw | bytes }} {{ t.unitRaw }}<app-explain [text]="t.treeRawHelp" /></small>
        }
    </span>

    <!--
    Keeps this row at the top while the rest is scrolled, filtered or searched. Two bars on one
    common scale say everything; what costs is getting them onto the screen at the same time.
    -->
    <button
        class="row__pin"
        type="button"
        [attr.aria-pressed]="pinned()"
        [class.row__pin--on]="pinned()"
        [title]="pinned() ? t.treeUnpin : t.treePin"
        (click)="pinToggled.emit()"
    >
        <span aria-hidden="true">{{ pinned() ? '★' : '☆' }}</span>
        <span class="sr-only">{{ pinned() ? t.treeUnpin : t.treePin }}</span>
    </button>
</div>

@if (open()) {
    <div class="chunk-files">
        <app-path-tree [items]="files()" [rawTotal]="node().rawBytes ?? null" />
    </div>
}
