@let t = i18n.ui();

<!--
One wrapping line: each entry with its size and what kind of entry it is, and the way to say the
rules got it wrong. The kind carries its explanation on its first entry only — fifty language files
would otherwise be fifty identical marks.
-->
@if (items().length > 0) {
    <div class="asides">
        <span>{{ t.notScreensLabel }}</span>
        @for (item of items(); track item.source) {
            <span class="aside">
                <b class="aside__name" [title]="item.source">{{ item.label }}</b>
                <span class="aside__size">{{ item.bytes | bytes }}</span>
                <span
                    >{{ item.kind }}
                    @if (item.first) {
                        <app-explain [text]="item.help" />
                    }
                </span>
                <span aria-hidden="true">·</span>
                <button
                    class="link-btn"
                    type="button"
                    [title]="t.markScreenHelp"
                    (click)="store.markAs(item.source, 'screen')"
                >
                    {{ t.markScreen }}
                </button>
            </span>
        }
    </div>
}

@if (marked(); as marks) {
    <p class="marks">
        {{ t.marksNote(marks) }}
        <button class="link-btn" type="button" (click)="store.clearMarks()">{{ t.marksReset }}</button>
    </p>
}
