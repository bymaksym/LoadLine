name: Publish

on:
    push:
        tags: ['v*']
    # Started by release-please.yml at the tag it just created: a tag pushed by GITHUB_TOKEN starts
    # no workflow on its own. Run at a tag, GITHUB_REF_NAME is that tag and the checks below hold.
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - run: pnpm install --frozen-lockfile

            - name: The tag is the version
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  version="$(node -p "require('./package.json').version")"
                  test "$tag" = "$version" || {
                      echo "tag $tag does not match package.json $version"
                      exit 1
                  }

            - name: The executable is still LF
              run: |
                  if grep -qU $'\r' bin/loadline.js; then
                      echo 'bin/loadline.js carries CRLF: the shebang would not survive Linux'
                      exit 1
                  fi

            - name: Tests
              run: pnpm test

            - name: Build the command
              run: pnpm run build:cli

            - name: Publish
              run: pnpm publish --access public --no-git-checks --provenance

            - name: GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                      echo "release $GITHUB_REF_NAME already exists — release-please wrote it"
                      exit 0
                  fi
                  gh release create "$GITHUB_REF_NAME" \
                      --verify-tag \
                      --title "$GITHUB_REF_NAME" \
                      --notes "Published to npm as \`@bymaksym/loadline@${GITHUB_REF_NAME#v}\`.

                  See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed."

            # Last, and only once npm has it: an announcement for something nobody can install yet is
            # a promise. The post itself is built by .github/scripts/announce-release.py, the same
            # file every public repo of ByMaksymDev Labs carries. Discord failing must not turn a
            # good publish red, hence continue-on-error. Without the secret it only prints.
            - name: Announce on Discord
              continue-on-error: true
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  DISCORD_ROLE_ID: ${{ vars.DISCORD_RELEASES_ROLE_ID }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
                  APP: Loadline
                  COLOR: '4169888'
                  ICON: https://raw.githubusercontent.com/bymaksym/LoadLine/main/public/icon-192.png
                  FOOTER: npm · @bymaksym/loadline
              run: python3 .github/scripts/announce-release.py
