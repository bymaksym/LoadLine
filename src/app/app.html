@let t = i18n.ui();
@let loaded = !!store.analysis();

<!--
One row, whatever is loaded: the mark, which build the figures are about, and the four controls.
It wraps instead of cutting a button off at the edge, which is what "Switch theme" used to do on a
phone.
-->
<header class="masthead">
    <div class="masthead__inner">
        <button class="brand" type="button" [attr.aria-label]="t.homeAria" (click)="home.show()">
            <!-- Three screens, each with its bar: boot / shared / own. Same drawing as the report rows. -->
            <svg aria-hidden="true" class="brand__mark" focusable="false" viewBox="0 0 26 26">
                <rect fill="#171b21" height="26" rx="6" width="26" />
                <rect fill="#8a94a3" height="3" width="7" x="5" y="5.5" />
                <rect fill="#e58450" height="3" width="4" x="13" y="5.5" />
                <rect fill="#45a9a9" height="3" width="5" x="18" y="5.5" />
                <rect fill="#8a94a3" height="3" width="7" x="5" y="11.5" />
                <rect fill="#e58450" height="3" width="4" x="13" y="11.5" />
                <rect fill="#45a9a9" height="3" width="2" x="18" y="11.5" />
                <rect fill="#8a94a3" height="3" width="7" x="5" y="17.5" />
                <rect fill="#45a9a9" height="3" width="1" x="13" y="17.5" />
            </svg>
            <strong class="brand__name">Loadline</strong>
            <span class="brand__tagline">{{ t.tagline }}</span>
        </button>

        <!--
        Which build this is talking about. It is a button because the answer to "this is not the
        build I meant" is right behind it: the front page, where the files are changed.
        -->
        @if (loaded) {
            <button class="build-chip" type="button" [title]="t.buildChipHelp" (click)="home.show()">
                <span aria-hidden="true" class="build-chip__ok">✓</span>
                @if (store.projectName(); as project) {
                    <span class="build-chip__project" [title]="t.projectNameHelp">{{ project }}</span>
                }
                <span class="build-chip__name">{{ home.statsStatus() }}</span>
                <span class="build-chip__unit" [attr.data-tone]="store.compressed() ? null : 'warn'">
                    · {{ store.compressed() ? store.mode() : t.unitRaw }}
                </span>
            </button>
        }

        <div class="masthead__actions">
            <button class="ctl ctl--bar" type="button" (click)="palette.show('jump')">
                {{ t.searchBtn }}
                <kbd class="masthead__kbd">{{ t.searchKeys }}</kbd>
            </button>
            <button class="ctl ctl--bar ctl--lang" type="button" (click)="i18n.toggle()">
                {{ i18n.lang() === 'es' ? 'EN' : 'ES' }}
            </button>
            <!--
            How much air the rows get, for the whole page. It changes spacing and nothing else — no
            column, no figure, no colour — so there is nothing it can hide, and it only appears once
            there is a table to squeeze.
            -->
            @if (loaded) {
                <button
                    class="ctl ctl--bar"
                    type="button"
                    [attr.aria-pressed]="density.density() === 'compact'"
                    [title]="t.densityHelp"
                    (click)="density.toggle()"
                >
                    {{ density.density() === 'compact' ? t.densityComfortable : t.densityCompact }}
                </button>
            }
            <button class="ctl ctl--bar" type="button" [title]="t.themeBtn" (click)="theme.toggle()">
                {{ theme.dark() ? t.themeToLight : t.themeToDark }}
            </button>
        </div>
    </div>
</header>

<!-- Jump anywhere: Ctrl/Cmd + K or the button above, `/` to search, `?` for the shortcuts. -->
@if (palette.open()) {
    <app-palette />
}

<main class="page" [class.page--home]="home.open()">
    <app-intake-page />

    @if (loaded && !home.open()) {
        <app-report-page />
    }
</main>
